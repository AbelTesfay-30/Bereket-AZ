<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="expenseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#expenseGrad)"/>
  <g transform="translate(25, 20)">
    <!-- Coin base -->
    <circle cx="25" cy="30" r="20" fill="white" fill-opacity="0.3"/>
    <circle cx="25" cy="30" r="15" fill="white"/>
    <!-- Dollar sign -->
    <text x="25" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#D97706" text-anchor="middle">$</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#fxGrad)"/>
  <g transform="translate(15, 25)">
    <!-- Chart lines -->
    <polyline points="0,50 15,30 30,40 45,15 60,25 70,5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Dots -->
    <circle cx="0" cy="50" r="4" fill="white"/>
    <circle cx="15" cy="30" r="4" fill="white"/>
    <circle cx="30" cy="40" r="4" fill="white"/>
    <circle cx="45" cy="15" r="4" fill="white"/>
    <circle cx="60" cy="25" r="4" fill="white"/>
    <circle cx="70" cy="5" r="4" fill="white"/>
  </g>
</svg>

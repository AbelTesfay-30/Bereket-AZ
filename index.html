<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routine Tracker Pro - Bereket AZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="bg-gray-900 min-h-screen text-white">
    <!-- Header -->
    <header class="bg-gray-800/50 backdrop-blur-lg border-b border-gray-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-3xl sm:text-4xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                        Bereket AZ
                    </h1>
                    <p class="text-gray-400 mt-1 text-sm sm:text-base">Routine Tracker Pro</p>
                </div>
                <div class="flex gap-3">
                    <button id="historyBtn" class="history-btn px-6 py-3 rounded-xl font-semibold text-white flex items-center gap-2 text-sm sm:text-base">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        History
                    </button>
                    <button id="exportBtn" class="export-btn px-6 py-3 rounded-xl font-semibold text-white flex items-center gap-2 text-sm sm:text-base">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Export CSV
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="stat-card bg-gray-800/50 backdrop-blur-lg rounded-2xl p-6 border border-gray-700">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl">📊</span>
                    <span class="text-gray-400 text-sm">Weekly Progress</span>
                </div>
                <span id="overallProgress" class="text-3xl font-bold text-emerald-400">0%</span>
            </div>
            <div class="stat-card bg-gray-800/50 backdrop-blur-lg rounded-2xl p-6 border border-gray-700">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl">✅</span>
                    <span class="text-gray-400 text-sm">Tasks Completed</span>
                </div>
                <span id="completedCount" class="text-3xl font-bold text-cyan-400">0</span>
            </div>
            <div class="stat-card bg-gray-800/50 backdrop-blur-lg rounded-2xl p-6 border border-gray-700">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl">💰</span>
                    <span class="text-gray-400 text-sm">Total Expense</span>
                </div>
                <span id="totalExpense" class="text-3xl font-bold text-purple-400">0 Birr</span>
            </div>
            <div class="stat-card bg-gray-800/50 backdrop-blur-lg rounded-2xl p-6 border border-gray-700">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-3xl">📅</span>
                    <span class="text-gray-400 text-sm">History Entries</span>
                </div>
                <span id="historyCount" class="text-3xl font-bold text-amber-400">0</span>
            </div>
        </div>

        <!-- Days Grid -->
        <div id="daysContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Days will be generated by JavaScript -->
        </div>
    </main>

    <!-- History Modal -->
    <div id="historyModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="text-2xl font-bold text-gray-200">Activity History</h2>
                <button id="closeModal" class="text-gray-400 hover:text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div id="historyList" class="space-y-4">
                    <!-- History items will be generated here -->
                </div>
                <div id="emptyHistory" class="text-center text-gray-400 py-8">
                    <p class="text-4xl mb-2">📭</p>
                    <p>No history entries yet</p>
                </div>
            </div>
            <div class="modal-footer">
                <button id="clearHistory" class="clear-history-btn px-4 py-2 rounded-lg text-sm font-medium text-red-400 hover:bg-red-400/10 transition-colors">
                    Clear All History
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800/30 border-t border-gray-700 mt-12 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-400 text-sm">
            <p>Routine Tracker Pro v1.0 | Bereket AZ | Stay consistent. Achieve your goals. 🚀</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
